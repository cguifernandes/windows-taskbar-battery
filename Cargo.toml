[package]
name = "taskbar-battery"
version = "0.2.0"
edition = "2021"

[dependencies]
hidapi = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# WinRT Bluetooth APIs.
windows = { version = "0.58", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Data_Xml_Dom",
    "Devices_Enumeration",
    "Devices_Power",
    "Foundation",
    "Foundation_Collections",
    "Gaming_Input",
    "Storage_Streams",
    "System_Power",
    "UI_Notifications",
    "Win32_System_Com",
] }
# Plain Win32 (window, GDI, registry, SetupAPI).
windows-sys = { version = "0.59", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# Win8+ compatibility manifest is required for layered child windows; also sets per-monitor DPI.
embed-manifest = "1.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
